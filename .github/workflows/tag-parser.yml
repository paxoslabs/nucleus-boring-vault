name: Tag Parser

on:
  # Allow manual triggering for testing
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/base/DecodersAndSanitizers/**/*.sol" # Only run when Solidity files in this directory change

jobs:
  parse-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history to detect file changes

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # Bun is not preinstalled on GitHub-hosted runners. It is used only as the
      # package manager here; tag_parse.js still runs under node.
      - name: Setup Bun
        # Pinned to a commit SHA (setup-bun v2.2.0) rather than a mutable tag.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm generates the Prisma client via @prisma/client's postinstall, but
      # bun does not run postinstall for untrusted deps, so do it explicitly.
      - name: Generate Prisma client
        run: bun run db:generate

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run tag parser for all files
        env:
          # Consumed by prisma/schema.prisma's datasource block, which
          # tag_parse.js resolves lazily on its first query.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Process all files
          echo "Processing all DecodersAndSanitizers files"
          node tag_parse.js --all-decoders --post
